name: Build and deploy ASP.Net Core app to Azure Web App - mediTrack

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**'
      - '.github/workflows/main_mediTrack.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore
        run: dotnet restore ./Backend/ClinicApp.API/ClinicApp.API.csproj

      - name: Build
        run: dotnet build ./Backend/ClinicApp.API/ClinicApp.API.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./Backend/ClinicApp.API/ClinicApp.API.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp" --no-build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

     

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mediTrack'
          slot-name: 'Production'
          package: .
