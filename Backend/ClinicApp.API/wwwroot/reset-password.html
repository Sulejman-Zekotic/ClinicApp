<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset lozinke - ClinicApp</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="app">
        <main class="main-layout">
            <section class="login-screen">
                <div class="login-panel login-panel--minimal login-panel--single">
                    <div class="login-form-card login-form-card--minimal">
                        <div class="section-header compact-header">
                            <div>
                                <span class="eyebrow">Sigurnost računa</span>
                                <h3>Postavite novu lozinku</h3>
                            </div>
                        </div>

                        <p class="meta-text">
                            Unesite novu lozinku za vaš račun. Link za reset važi ograničeno vrijeme.
                        </p>

                        <div class="form-grid">
                            <div class="password-field">
                                <input type="password" id="resetNewPassword" placeholder="Nova lozinka" />
                                <button type="button" class="password-toggle" onclick="togglePasswordVisibility('resetNewPassword', this)">Prikaži</button>
                            </div>

                            <div class="password-field">
                                <input type="password" id="resetConfirmPassword" placeholder="Potvrdite novu lozinku" />
                                <button type="button" class="password-toggle" onclick="togglePasswordVisibility('resetConfirmPassword', this)">Prikaži</button>
                            </div>

                            <button type="button" onclick="submitResetPassword()">Sačuvaj novu lozinku</button>
                        </div>

                        <p id="resetPasswordResult" class="message"></p>

                        <div class="login-actions-stack">
                            <a href="/" class="secondary-btn" style="text-align:center; text-decoration:none;">Nazad na prijavu</a>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            initializeResetPasswordPage();
        });
    </script>
</body>
</html>
