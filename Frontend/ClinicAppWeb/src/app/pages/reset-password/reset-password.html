<div class="auth-page auth-page--compact">
  <div class="auth-page__panel">
    <div class="auth-card auth-card--compact">
      <h1 class="auth-title">Nova lozinka</h1>

      <form class="auth-form" (ngSubmit)="submit()">
        <label class="auth-field">
          <span class="auth-field__label">Nova lozinka</span>
          <input
            class="clinic-input"
            [(ngModel)]="newPassword"
            name="newPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Najmanje 8 znakova">
        </label>

        <label class="auth-field">
          <span class="auth-field__label">Potvrdi lozinku</span>
          <input
            class="clinic-input"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Ponovite novu lozinku">
        </label>

        @if (errorMessage) {
          <div class="ui-alert ui-alert--danger">
            {{ errorMessage }}
          </div>
        }

        <button type="submit" class="clinic-button-primary auth-form__submit" [disabled]="isSubmitting">
          @if (isSubmitting) {
            <app-loading-spinner [inline]="true" size="sm"></app-loading-spinner>
          }
          {{ isSubmitting ? 'Spremanje...' : 'Sacuvaj lozinku' }}
        </button>
      </form>

      <div class="auth-links auth-links--centered">
        <a routerLink="/login" class="auth-link">
          <svg class="auth-link__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Nazad na prijavu
        </a>
      </div>
    </div>
  </div>
</div>
