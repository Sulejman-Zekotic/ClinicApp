<div class="auth-page auth-page--compact">
  <div class="auth-page__panel">
    <div class="auth-card auth-card--compact">
      <p class="auth-kicker">Secure reset</p>
      <h1 class="auth-title">Create a new password</h1>
      <p class="auth-subtitle">
        Use a strong password you have not used for this account before.
      </p>

      <form class="auth-form" (ngSubmit)="submit()">
        <label class="auth-field">
          <span class="auth-field__label">New password</span>
          <input
            class="clinic-input"
            [(ngModel)]="newPassword"
            name="newPassword"
            type="password"
            autocomplete="new-password"
            placeholder="At least 8 characters">
        </label>

        <label class="auth-field">
          <span class="auth-field__label">Confirm password</span>
          <input
            class="clinic-input"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Repeat the new password">
        </label>

        @if (errorMessage) {
          <div class="ui-alert ui-alert--danger">
            {{ errorMessage }}
          </div>
        }

        <button type="submit" class="clinic-button-primary auth-form__submit" [disabled]="isSubmitting">
          @if (isSubmitting) {
            <app-loading-spinner [inline]="true" size="sm"></app-loading-spinner>
          }
          {{ isSubmitting ? 'Saving...' : 'Update password' }}
        </button>
      </form>

      <div class="auth-links">
        <a routerLink="/login" class="auth-link">Back to login</a>
      </div>
    </div>
  </div>
</div>
