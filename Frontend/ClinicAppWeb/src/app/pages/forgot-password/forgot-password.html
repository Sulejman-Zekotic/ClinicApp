<div class="auth-page auth-page--compact">
  <div class="auth-page__panel">
    <div class="auth-card auth-card--compact">
      <p class="auth-kicker">Access recovery</p>
      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-subtitle">
        We will send a secure reset link to the username or email you enter below.
      </p>

      <form class="auth-form" (ngSubmit)="submit()">
        <label class="auth-field">
          <span class="auth-field__label">Username or email</span>
          <input
            class="clinic-input"
            [(ngModel)]="usernameOrEmail"
            name="usernameOrEmail"
            autocomplete="username"
            placeholder="nurse.a or nurse.a@meditrack.local">
        </label>

        @if (successMessage) {
          <div class="ui-alert ui-alert--success">
            {{ successMessage }}
          </div>
        }

        @if (errorMessage) {
          <div class="ui-alert ui-alert--danger">
            {{ errorMessage }}
          </div>
        }

        <button type="submit" class="clinic-button-primary auth-form__submit" [disabled]="isSubmitting">
          @if (isSubmitting) {
            <app-loading-spinner [inline]="true" size="sm"></app-loading-spinner>
          }
          {{ isSubmitting ? 'Sending...' : 'Send reset link' }}
        </button>
      </form>

      <div class="auth-links">
        <a routerLink="/login" class="auth-link">Back to login</a>
      </div>
    </div>
  </div>
</div>
